<!-- src/app/shared/components/workspace-view/workspace-view.component.html -->
<div class="workspace-wrapper d-flex flex-column position-relative h-100 w-100 overflow-hidden bg-white" style="height: 100%;">

  <!-- LEVEL 2: View Level Header -->
  <header class="bg-white border-bottom px-4 d-flex align-items-center justify-content-between flex-shrink-0" 
          style="height: var(--global-header-height); z-index: 1025; position: relative; background-color: #ffffff !important;">
    <div class="d-flex align-items-center gap-2">
      <!-- Fixed: Uses isLeftPresent() so button only shows if a left sidebar actually exists -->
      @if (isMobile() && isLeftPresent() && !globalSettings.headerLaunchButtons()) {
             <button (click)="toggleLeft()" 
              class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center p-1 shadow-sm" 
              title="Toggle Left Sidebar" 
              aria-label="Toggle Left Sidebar">
        <!-- Left Panel Dock SVG --> <!-- was Sidebar L -->
        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M9 3v18"/>
          <path d="M5 8h2"/>
          <path d="M5 12h2"/>
        </svg>
        
        </button>
      } 
      <h1 class="h5 mb-0 fw-bold text-dark">{{ pageTitle() }}</h1>
    </div>
    
    <div class="d-flex align-items-center gap-2">
      <ng-content select="[header-actions]"></ng-content>
      <!-- Fixed: Uses isRightPresent() so button only shows if a right sidebar actually exists -->
      @if (isMobile() && isRightPresent() && !globalSettings.headerLaunchButtons()) {
         <button (click)="toggleRight()" 
              class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center justify-content-center p-1 shadow-sm" 
              title="Toggle Right Inspector" 
              aria-label="Toggle Right Inspector">
        <!-- Right Panel Dock SVG --> <!-- was Sidebar R -->
        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M15 3v18"/>
          <path d="M17 8h2"/>
          <path d="M17 12h2"/>
        </svg>
        </button>
      }
    </div>
  </header>

  <!-- THE 3-PART GRID VIEW MATRIX FRAMEWORK -->
  <div class="matrix-body-row d-flex flex-grow-1 position-relative overflow-hidden w-100" 
       style="height: calc(100% - var(--global-header-height));">
    
    <ng-content select="[left-sidebar]"></ng-content>

    <main class="main-workspace-content flex-grow-1 overflow-y-auto bg-light position-relative h-100" style="scrollbar-gutter: stable; height: 100%;">
      <ng-content select="[main-content]"></ng-content>
    </main>
 
    <ng-content select="[right-sidebar]"></ng-content>

    <!-- Fixed: Strictly gated to isMobile() so desktop screens never render a backdrop -->
    @if (globalSettings.touchOverlayClose() && (leftSidebarOpen() || rightSidebarOpen()) && isMobile()) {
      <div class="sidebar-backdrop position-absolute top-0 start-0 w-100 h-100" 
           (click)="closeBoth()"
           style="background-color: rgba(0,0,0,0.4); z-index: 1035; cursor: pointer; transition: opacity 0.2s ease;">
      </div>
    }
  </div>
</div>

<div class="login-container">
  <h1>LoginComponent Works!</h1>


        <!-- INTERACTIVE DEMO AUTH TOGGLE BUTTON -->
      <button 
        class="btn btn-sm px-3 fw-bold shadow-sm transition-all text-white border"
        [ngClass]="authService.isAuthenticated() ? 'btn-danger' : 'btn-success'"
        (click)="authService.toggleAuthenticationState()">
        {{ authService.isAuthenticated() ? '🔒 Simulate Logout' : '🔑 Simulate Login' }}
      </button>    
</div>

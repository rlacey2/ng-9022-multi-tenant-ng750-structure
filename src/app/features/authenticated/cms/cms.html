<!-- src/app/features/authenticated/components/cms/cms.component.html -->
<app-workspace-view pageTitle="CMS">

  <!-- Column 1: Left Workspace Activities Sidebar -->
  <div left-sidebar #leftSidebarRef class="list-group list-group-flush p-2 gap-1" style="width: var(--sidebar-left-width);">
    <button class="btn btn-outline-primary btn-sm text-start py-2">Clear</button>
   
    <!-- src/app/features/authenticated/components/cms/cms.component.html (or left-sidebar block) -->

<div class="dropdown">
  <!-- The primary trigger button matching your exact custom padding and styling rules -->
  <button 
    class="btn btn-outline-primary btn-sm text-start py-2 w-100 dropdown-toggle shadow-sm" 
    type="button" 
    id="newActionDropdown" 
    data-bs-toggle="dropdown" 
    aria-expanded="false">
    New
  </button>
  
  <!-- The nested options panel card list container -->
  <ul class="dropdown-menu shadow p-2 mt-1 rounded-3 w-100" aria-labelledby="newActionDropdown" style="z-index: 1050;">
    <li>
      <button class="dropdown-item rounded py-2 small fw-medium" type="button" (click)="onCreateNew('Alpha')">
        ➕ New Alpha Node
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded py-2 small fw-medium" type="button" (click)="onCreateNew('Beta')">
        ✨ New Beta Matrix
      </button>
    </li>
  </ul>
</div>

   <button class="btn btn-outline-primary text-start py-2 shadow-sm">Save</button>
    <button class="btn btn-outline-primary btn-sm text-start py-2">Cancel</button>
    <button class="btn btn-outline-primary btn-sm text-start py-2">Duplicate</button>
    <button class="btn btn-outline-primary btn-sm text-start py-2">Delete</button>
  </div>

    <!-- Column 3: Right Workspace Inspector Sidebar -->
  <div right-sidebar #rightSidebarRef class="p-3" style="width: var(--sidebar-right-width);">
    <h6 class="fw-bold text-dark text-uppercase small mb-3">Preview Matrix</h6>
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-xs btn-outline-secondary w-50 py-1">Open</button>
      <button class="btn btn-xs btn-outline-secondary w-50 py-1">Close</button>
    </div>
    <div class="list-group list-group-flush gap-1">
      <div class="p-2 bg-warning-subtle rounded small d-flex justify-content-between align-items-center">
        <span>01</span>
        <input type="radio" checked name="preview-nodes">
      </div>
    </div>
  </div>

  <!-- Column 2: REPLACING THE ENTIRE [main-content] ELEMENT HOOK FOR STICKY INSIDE-COLUMN RETENTION -->
  <div main-content class="w-100 h-100 position-relative">
    
    <!-- 🛑 SOLID STICKY CONTAINER: Encapsulates Level 3 & 4 inside the scroll zone -->
    <div class="sticky-top w-100 border-bottom pt-2 pb-1" style="z-index: 1020; top: 0; background-color: #ffffff !important;">
      
      <!-- LEVEL 3 STICKY NOTIFICATION BADGE ROW -->
      <div class="px-3 mb-2 d-flex gap-2">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 small fw-semibold">Status Override</span>
        <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 small fw-semibold">Public Now</span>
      </div>

      <!-- LEVEL 4 STICKY METADATA INFO BAR -->
      <!-- Styled matching your yellow corporate matrix framework card -->
      <div class="p-2 border rounded-3 mx-3 d-flex gap-3 shadow-sm" style="background-color: #e9edc9 !important; border-color: #ccd5ae !important;">
        <div class="flex-grow-1">
          <label class="extra-small text-muted d-block fw-bold mb-1 text-uppercase tracking-wider">Name*</label>
          <div class="fw-bold text-dark fs-5">0 Credit Card</div>
        </div>
        <div class="px-3 border-start border-end text-center" style="min-width: 85px;">
          <label class="extra-small text-muted d-block fw-bold mb-1 text-uppercase tracking-wider">EventId</label>
          <div class="fw-bold text-dark fs-5">103</div>
        </div>
        <div style="min-width: 240px;">
          <label class="extra-small text-muted d-block fw-bold mb-1 text-uppercase tracking-wider">Event Status*</label>
          <div class="fw-bold text-dark fs-5">3) Released To Public ▾</div>
        </div>
      </div>

    </div>

    <!-- THE ACTUAL CONTENT PANELS IN THE TIMELINE FLOW -->
    <div class="p-3 d-flex flex-column gap-2">
      
      <div class="card border-0 p-3 bg-purple-subtle text-dark rounded-3 d-flex justify-content-between flex-row align-items-center shadow-sm">
        <span class="fw-bold">1) Configuration</span>
        <span class="small text-muted font-monospace d-none d-md-inline">14/03/2025:12:01AM - 31/12/2036:1:01AM</span>
      </div>
      
      <div class="card border-0 p-3 bg-purple-subtle text-dark rounded-3 shadow-sm d-flex justify-content-between flex-row align-items-center">
        <span class="fw-bold">2) Template Theme / Banner Image</span>
        <span class="text-muted">▾</span>
      </div>
      
      <div class="card border-0 p-3 bg-purple-subtle text-dark rounded-3 shadow-sm d-flex justify-content-between flex-row align-items-center">
        <span class="fw-bold">3) Overview Information</span>
        <span class="text-muted">▾</span>
      </div>
      
      <!-- Added extensive padding margin rule below footer element to demonstrate sticky functionality -->
      <div class="card border-0 p-3 bg-purple-subtle text-dark rounded-3 shadow-sm d-flex justify-content-between flex-row align-items-center" style="margin-bottom: 900px;">
        <span class="fw-bold">4) Footer Information</span>
        <span class="text-muted">▾</span>
      </div>

    </div>

  </div>



</app-workspace-view>

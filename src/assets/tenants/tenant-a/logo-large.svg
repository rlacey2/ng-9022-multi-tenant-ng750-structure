<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <!-- Smooth gradient matching the vibrant orange tenant theme color -->
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background container grid layout element -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <!-- Stylized Branding Mark Logo Graphic Component -->
  <g transform="translate(20, 15)">
    <!-- Abstract clean intersecting polygon upward nodes -->
    <path d="M 0 40 L 20 5 L 40 40 Z" fill="url(#apexGrad)" filter="url(#dropShadow)" />
    <path d="M 25 40 L 40 18 L 55 40 Z" fill="#3f51b5" opacity="0.9" />
    <circle cx="20" cy="18" r="4" fill="#ffffff" />
  </g>

  <!-- Corporate Typography Text Layers -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="0.5">APEX</text>
  <text x="162" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" fill="#ff5722" letter-spacing="0.5">INNOVATIONS</text>
  
  <!-- Subtle structural metadata text tag line -->
  <text x="92" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9e9e9e" letter-spacing="2">LOCAL ASSET PROOF</text>
</svg>
